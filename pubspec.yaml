publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI básica
  cupertino_icons: ^1.0.8

  # Data/DB
  sqflite: ^2.4.0
  path: ^1.9.0

  # Exportar/abrir CSV (Android)
  permission_handler: ^11.3.1
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
