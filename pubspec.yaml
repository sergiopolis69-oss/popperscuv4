name: popperscuv

description: "POS de inventario, ventas y clientes offline"

publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1

  cupertino_icons: ^1.0.8
  intl: ^0.19.0

  # DB / Paths
  sqflite: ^2.4.0
  path: ^1.9.0
  path_provider: ^2.1.5

  # Utilidades
  csv: ^6.0.0
  file_picker: ^8.3.7
  uuid: ^4.5.1

  # Exportar / permisos Android
  permission_handler: ^11.3.1
  open_filex: ^4.5.0
  media_store_plus: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
